name: CI/CD Pipeline - Digital Construction ERP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint & Type Check
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build Application
        run: npm run build

  deploy-cloud-run:
    name: Deploy to Google Cloud Run
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker Push
        run: gcloud auth configure-docker

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="gcr.io/${{ secrets.GCP_PROJECT_ID }}/digital-construction-erp:${{ github.sha }}"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy digital-construction-erp \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/digital-construction-erp:${{ github.sha }} \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --port 3000 \
            --set-env-vars ENCRYPTION_SECRET_KEY=${{ secrets.ENCRYPTION_SECRET_KEY }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
